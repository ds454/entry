# Envoy config
static_resources:
  listeners:
  - name: grpc_ingress
    address:
      socket_address:
        address: 0.0.0.0
        # Envoy listens on this port
        port_value: ${ENTRY_PORT}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: grpc_ingress
          codec_type: AUTO

          # Close streams that send nothing for 5 minutes
          stream_idle_timeout: 300s

          route_config:
            name: grpc_routes
            virtual_hosts:
            - name: grpc
              domains: ["*"]
              routes:

              # Requests to this specific path... 
              - match:
                  path: "${AUTH_SERVICE_CONTEXT_PATH}${AUTH_SERVICE_LOGIN_PATH}"
                # ...go here...
                route:
                  cluster: auth_service
                  timeout: 1s
                  max_stream_duration:
                    grpc_timeout_header_max: 0s
                # ...and skip authentication.
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

              # Requests to this specific path...
              - match:
                  path: "${USER_SERVICE_CONTEXT_PATH}${USER_SERVICE_REGISTER_PATH}"
                # ...go here...
                route:
                  cluster: user_service
                # ...and skip authentication.
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

              # Requests starting with this...
              - match:
                  prefix: ${USER_SERVICE_CONTEXT_PATH}
                # ...go here.
                route:
                  cluster: user_service
              
              # Requests starting with this...
              - match:
                  prefix: ${GAME_SERVICE_CONTEXT_PATH}
                # ...go here.
                route:
                  cluster: game_service

          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              grpc_service:
                envoy_grpc:
                  cluster_name: auth_service
                timeout: 0.5s
              # Failed requests don't continue
              failure_mode_allow: false
              status_on_error:
                code: ServiceUnavailable
              allowed_headers:
                patterns:
                - exact: ${AUTH_SESSION_TOKEN_HEADER_KEY}

          # Then they get passed to the backend
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:

  # Authentication
  - name: auth_service

    # Loadbalances across all pods in service
    type: STRICT_DNS

    # Only use IPv4
    dns_lookup_family: V4_ONLY

    # Auth has to be pretty reactive
    connect_timeout: 1s

    # Send new requests to pods that aren't doing much
    lb_policy: LEAST_REQUEST

    # Force HTTP2
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}   # gRPC needs HTTP/2 to the upstream
    load_assignment:
      cluster_name: auth_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ${AUTH_SERVICE_HOSTNAME}
                port_value: ${AUTH_SERVICE_PORT}

    # Health checks fail after nothing happens after 1 second.
    # Health check frequency is configurable. Dev and prod will have a lower interval to be more reactive, while local-dev will have a higher interval to avoid nuking our laptops.
    health_checks:
    - timeout: 1s
      interval: ${AUTH_HEALTH_INTERVAL}
      # After a pod fails a health check twice, it is considered unhealthy and requests aren't routed to it anymore
      unhealthy_threshold: 2
      healthy_threshold: 1
      ${AUTH_SERVICE_HEALTH_METHOD}_health_check: {}

  # User Service
  - name: user_service
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    connect_timeout: 5s
    lb_policy: LEAST_REQUEST

    # Force HTTP2
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: auth_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ${USER_SERVICE_HOSTNAME}
                port_value: ${USER_SERVICE_PORT}
    health_checks:
    - timeout: 5s
      interval: ${USER_HEALTH_INTERVAL}
      unhealthy_threshold: 2
      healthy_threshold: 1
      ${USER_SERVICE_HEALTH_METHOD}_health_check: {}

  # Game Service
  - name: game_service
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    connect_timeout: 5s
    lb_policy: LEAST_REQUEST

    # Force HTTP2
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: game_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ${GAME_SERVICE_HOSTNAME}
                port_value: ${GAME_SERVICE_PORT}
    health_checks:
    - timeout: 5s
      interval: ${GAME_HEALTH_INTERVAL}
      unhealthy_threshold: 2
      healthy_threshold: 1
      ${GAME_SERVICE_HEALTH_METHOD}_health_check: {}
