# Envoy config
static_resources:
  listeners:
  - name: grpc_ingress
    address:
      socket_address:
        address: 0.0.0.0
        port_value: ${ENTRY_PORT}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: grpc_ingress
          codec_type: AUTO

          # Close streams that send nothing for 5 minutes (Envoy's default, made explicit).
          stream_idle_timeout: 300s

          route_config:
            name: grpc_routes
            virtual_hosts:
            - name: grpc
              domains: ["*"]
              routes:

              # 
              - match:
                  path: "/auth.v1.AuthService/Login"
                route: &auth_route
                  cluster: auth_service
                  timeout: 1s
                  max_stream_duration:
                    grpc_timeout_header_max: 0s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

              - match:
                  path: "/auth.v1.AuthService/Refresh"
                route: *auth_route
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

              # --- Everything below requires a valid session -------------------
              # Logout, ChangePassword, etc. on the auth service itself
              - match:
                  prefix: ${}
                route: *auth_route

              # Add one route per backend service here.
              # Unmatched paths get gRPC status UNIMPLEMENTED (12) from Envoy.
              # Never route /envoy.service.auth.v3.Authorization/ - Check stays internal.

          http_filters:
          # All requests go through auth first
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              grpc_service:
                envoy_grpc:
                  cluster_name: auth_service
                timeout: 0.5s
              # Failed requests don't continue
              failure_mode_allow: false
              status_on_error:
                code: ServiceUnavailable
              allowed_headers:
                patterns:
                - exact: ${AUTH_SESSION_TOKEN_HEADER_KEY}

          # 3. Route to the backend (must be last).
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:

  # Authentication
  - name: auth_service

    # Loadbalances across all pods in service
    type: STRICT_DNS

    # Only use IPv4
    dns_lookup_family: V4_ONLY

    # Auth has to be pretty reactive
    connect_timeout: 1s

    # Send new requests to pods that aren't doing much
    lb_policy: LEAST_REQUEST

    # Force HTTP2
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}   # gRPC needs HTTP/2 to the upstream
    load_assignment:
      cluster_name: auth_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ${AUTH_SERVICE_HOSTNAME}
                port_value: ${AUTH_SERVICE_PORT}

    # Health checks fail after nothing happens after 1 second.
    # Health check frequency is configurable. Dev and prod will have a lower interval to be more reactive, while local-dev will have a higher interval to avoid nuking our laptops.
    health_checks:
    - timeout: 1s
      interval: ${AUTH_HEALTH_INTERVAL}
      # After a pod fails a health check twice, it is considered unhealthy and requests aren't routed to it anymore
      unhealthy_threshold: 2
      healthy_threshold: 1
      grpc_health_check: {}

  # User Service
  - name: user_service

    # Loadbalances across all pods in service
    type: STRICT_DNS

    # Only use IPv4
    dns_lookup_family: V4_ONLY

    # User doesn't need to be super reactive
    connect_timeout: 5s

    # Send new requests to pods that aren't doing much
    lb_policy: LEAST_REQUEST

    # Force HTTP2
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}   # gRPC needs HTTP/2 to the upstream
    load_assignment:
      cluster_name: auth_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ${USER_SERVICE_HOSTNAME}
                port_value: ${USER_SERVICE_PORT}

    # Health checks fail after nothing happens after 5 seconds.
    health_checks:
    - timeout: 5s
      interval: ${USER_HEALTH_INTERVAL}
      # After a pod fails a health check twice, it is considered unhealthy and requests aren't routed to it anymore
      unhealthy_threshold: 2
      healthy_threshold: 1
      grpc_health_check: {}
